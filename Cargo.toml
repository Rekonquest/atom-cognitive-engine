[workspace]
resolver = "3"
members = [
    "crates/atom-cognitive-core",
    "crates/atom-cognitive-engine",
    "crates/atom-cognitive-cli",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Lucerna-Labs/atom-cognitive-engine"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
